name: "Bug report / Ошибка"
description: "Report something that went wrong / Расскажите, что пошло не так"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing reports](https://github.com/ub3dqy/uptime-kuma/issues?q=is%3Aissue) first.
        Убедитесь, что [такой ошибки ещё нет](https://github.com/ub3dqy/uptime-kuma/issues?q=is%3Aissue).

        Reports are public. Remove passwords, tokens, and private addresses from logs and screenshots.
        Отчёты общедоступны. Уберите пароли, токены и закрытые адреса из журналов и снимков экрана.
  - type: input
    id: version
    attributes:
      label: "Version and setup / Версия и установка"
      description: "Include the Kuma version, operating system, and how you installed it / Укажите версию Kuma, систему и способ установки"
      placeholder: "2.5.8-ub3dqy.preview.2, Docker, Linux x86-64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Как повторить"
      description: "List the steps starting from a working setup / Опишите шаги с момента, когда всё работало"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result / Что ожидали"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual result / Что получилось"
      description: "Include the error text if you saw one / Если увидели сообщение об ошибке, приведите его текст"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Logs or screenshots / Журнал или снимки экрана"
      description: "Optional. Share only the relevant excerpt with private details removed / Необязательно. Достаточно нужного фрагмента без личных данных"
