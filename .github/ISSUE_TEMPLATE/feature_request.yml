name: "Suggestion / Предложение"
description: "Tell us what would make Kuma more useful / Расскажите, что сделало бы Kuma полезнее"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing suggestions](https://github.com/ub3dqy/uptime-kuma/issues?q=is%3Aissue+label%3Aenhancement) first.
        Проверьте, [есть ли уже такое предложение](https://github.com/ub3dqy/uptime-kuma/issues?q=is%3Aissue+label%3Aenhancement).
  - type: textarea
    id: task
    attributes:
      label: "What are you trying to do? / Какую задачу вы решаете?"
      description: "Describe a real situation and where the current version gets in the way / Опишите ситуацию и что мешает в текущей версии"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "What would help? / Что бы помогло?"
      description: "Tell us what you would like to be able to do / Расскажите, какой результат вам нужен"
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: "How do you do it today? / Как вы решаете эту задачу сейчас?"
