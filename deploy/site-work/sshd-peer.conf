Match User kuma-site-peer Address 192.0.2.20
    AllowUsers kuma-site-peer
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitOpen none
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    MaxSessions 1
    ForceCommand /usr/bin/cat -- /var/lib/uptime-kuma-site-state/state.json
Match all
